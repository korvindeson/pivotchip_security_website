<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Devices syncing logs to one collector that produces a single severity-rated client report" font-family="Segoe UI, Tahoma, Verdana, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a252f"/>
      <stop offset="1" stop-color="#2c3e50"/>
    </linearGradient>
    <pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#3d5567"/>
    </pattern>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#bg)"/>
  <rect width="800" height="500" rx="24" fill="url(#dots)" opacity="0.25"/>

  <!-- deployed devices -->
  <g fill="none" stroke="#6a8aa6" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round">
    <path d="M142 150 C 175 150 175 244 200 247"/>
    <path d="M142 250 C 170 250 180 250 200 250"/>
    <path d="M142 350 C 175 350 175 256 200 253"/>
  </g>
  <g font-size="17" font-weight="700" fill="#dbe6ee" text-anchor="middle">
    <rect x="30" y="140" width="12" height="20" fill="#b9c4cc"/>
    <rect x="40" y="130" width="102" height="40" rx="10" fill="#14181c" stroke="#3a4752" stroke-width="2"/>
    <circle cx="126" cy="150" r="4" fill="#3498db"/>
    <text x="80" y="156">DEV 01</text>

    <rect x="30" y="240" width="12" height="20" fill="#b9c4cc"/>
    <rect x="40" y="230" width="102" height="40" rx="10" fill="#14181c" stroke="#3a4752" stroke-width="2"/>
    <circle cx="126" cy="250" r="4" fill="#3498db"/>
    <text x="80" y="256">DEV 02</text>

    <rect x="30" y="340" width="12" height="20" fill="#b9c4cc"/>
    <rect x="40" y="330" width="102" height="40" rx="10" fill="#14181c" stroke="#3a4752" stroke-width="2"/>
    <circle cx="126" cy="350" r="4" fill="#3498db"/>
    <text x="80" y="356">DEV 03</text>
  </g>
  <text x="86" y="410" text-anchor="middle" font-size="19" fill="#b8d3e8">deployed devices</text>

  <!-- collector -->
  <rect x="200" y="150" width="150" height="200" rx="12" fill="#1b2f42" stroke="#3d5468" stroke-width="2"/>
  <g>
    <rect x="216" y="172" width="118" height="34" rx="6" fill="#101d2b" stroke="#22384c"/>
    <circle cx="230" cy="189" r="4.5" fill="#3498db"/>
    <rect x="242" y="185" width="76" height="8" rx="4" fill="#2a4459"/>
    <rect x="216" y="220" width="118" height="34" rx="6" fill="#101d2b" stroke="#22384c"/>
    <circle cx="230" cy="237" r="4.5" fill="#27ae60"/>
    <rect x="242" y="233" width="76" height="8" rx="4" fill="#2a4459"/>
    <rect x="216" y="268" width="118" height="34" rx="6" fill="#101d2b" stroke="#22384c"/>
    <circle cx="230" cy="285" r="4.5" fill="#3498db"/>
    <rect x="242" y="281" width="76" height="8" rx="4" fill="#2a4459"/>
  </g>
  <text x="275" y="410" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="1" fill="#b8d3e8">LOG COLLECTOR</text>

  <!-- arrow -->
  <g font-size="16" fill="#b8d3e8" text-anchor="middle">
    <text x="395" y="222">one merged</text>
    <text x="395" y="241">report</text>
  </g>
  <path d="M360 262 L 414 262" fill="none" stroke="#3498db" stroke-width="3" stroke-dasharray="8 6"/>
  <polygon points="432,262 412,251 412,273" fill="#3498db"/>

  <!-- report paper -->
  <rect x="448" y="48" width="340" height="420" rx="12" fill="#081018" opacity="0.6"/>
  <rect x="440" y="40" width="340" height="420" rx="12" fill="#f5f8fa" stroke="#d5dde3"/>
  <text x="462" y="82" font-size="27" font-weight="700" letter-spacing="1" fill="#2c3e50">CLIENT REPORT</text>
  <text x="462" y="108" font-size="17" fill="#55656f">ACME HQ &#183; 2026-10-12</text>
  <rect x="462" y="122" width="296" height="2" fill="#dfe6e9"/>

  <!-- severity rows -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="462" y="138" width="104" height="28" rx="14" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="514" y="157" fill="#a93226">CRITICAL</text>
    <rect x="580" y="144" width="178" height="7" rx="3.5" fill="#cfd8de"/>
    <rect x="580" y="156" width="134" height="5" rx="2.5" fill="#e3eaee"/>

    <rect x="462" y="176" width="104" height="28" rx="14" fill="#fef5e7" stroke="#f39c12" stroke-width="1.5"/>
    <text x="514" y="195" fill="#935d0b">HIGH</text>
    <rect x="580" y="182" width="156" height="7" rx="3.5" fill="#cfd8de"/>
    <rect x="580" y="194" width="118" height="5" rx="2.5" fill="#e3eaee"/>

    <rect x="462" y="214" width="104" height="28" rx="14" fill="#fdf9e7" stroke="#f1c40f" stroke-width="1.5"/>
    <text x="514" y="233" fill="#7d6608">MED</text>
    <rect x="580" y="220" width="142" height="7" rx="3.5" fill="#cfd8de"/>
    <rect x="580" y="232" width="104" height="5" rx="2.5" fill="#e3eaee"/>
  </g>

  <!-- ATT&CK rows -->
  <text x="462" y="278" font-size="17" font-weight="700" letter-spacing="1" fill="#1f6fa8">MITRE ATT&amp;CK</text>
  <g font-size="16.5" font-family="Consolas, Menlo, monospace" fill="#34444f">
    <text x="462" y="305">T1078&#160;Valid Accounts</text>
    <text x="462" y="331">T1059&#160;Command and Scripting</text>
    <text x="462" y="357">T1552&#160;Unsecured Credentials</text>
  </g>

  <!-- export badges -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="462" y="374" width="62" height="28" rx="5" fill="#2c3e50"/>
    <text x="493" y="393" fill="#ffffff">PDF</text>
    <rect x="532" y="374" width="62" height="28" rx="5" fill="#34495e"/>
    <text x="563" y="393" fill="#ffffff">JSON</text>
    <rect x="602" y="374" width="62" height="28" rx="5" fill="#34495e"/>
    <text x="633" y="393" fill="#ffffff">CSV</text>
  </g>
  <g font-size="15" fill="#55656f">
    <text x="462" y="426">executive summary &#183; timeline &#183;</text>
    <text x="462" y="446">plain-language findings</text>
  </g>
</svg>
